# Atualiza estrelas, licenças, linguagens e datas das skills direto da API do
# GitHub (scripts/refresh-github.mjs) e regenera data/skills.js.
# Roda toda segunda-feira e também quando alguém clica em "Run workflow" na aba
# Actions. Só faz commit quando algum dado mudou.
name: Atualizar dados do GitHub

on:
  schedule:
    - cron: '37 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Buscar dados no GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/refresh-github.mjs

      - name: Gerar data/skills.js
        run: node scripts/build-data.mjs

      - name: Salvar as mudanças
        run: |
          if git diff --quiet -- data/; then
            echo "Nada mudou."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/skills.json data/skills.js
          git commit -m "Atualiza estrelas e datas das skills"
          git push origin "HEAD:$GITHUB_REF_NAME"
